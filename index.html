<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f6cbd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Staff Timesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Staff Timesheet</title>
<style>
  :root{
    --brand:#0f6cbd;--brand-dark:#0a4f8a;--bg:#eef1f5;--card:#ffffff;--ink:#1f2329;--muted:#6a7280;--line:#e3e7ec;
    --amber:#b86e00;--green:#0f7b3f;--red:#b3261e;
  }
  *{box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100%;position:relative;}
  .appbar{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 16px 14px;display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .appbar .ttl{font-size:16px;font-weight:600;flex:1;}
  .appbar .user{font-size:11px;background:rgba(255,255,255,.22);padding:4px 9px;border-radius:20px;cursor:pointer;}
  .body{flex:1;overflow-y:auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 100px);max-width:560px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch;}
  .body::-webkit-scrollbar{width:0;}
  .sh{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin:2px 2px 4px;}
  .meta{color:var(--muted);font-size:12px;line-height:1.5;}
  .weekhead{margin:2px 2px 12px;}
  .weekhead .rng{font-size:15px;font-weight:600;color:var(--ink);}
  .weekhead .close{font-size:12px;color:var(--amber);margin-top:2px;}
  label{display:block;font-size:12.5px;font-weight:600;color:#3b424b;margin:0 0 5px;}
  input,select{width:100%;padding:11px;border:1px solid #cdd3da;border-radius:8px;font-size:16px;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,108,189,.15);}
  .row2{display:flex;gap:8px;} .row2 .gwo{flex:1;} .row2 .ghr{width:84px;}
  .day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:11px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .day .dayhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .day .dayname{font-weight:600;font-size:14px;}
  .day .daytot{font-weight:700;font-size:14px;color:var(--brand-dark);}
  .line{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;position:relative;}
  .line .num{font-size:11px;font-weight:700;color:var(--brand);}
  .line .del{position:absolute;right:8px;top:7px;cursor:pointer;color:#b3b9c0;font-size:18px;padding:2px 6px;}
  .combo{position:relative;}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 3px);background:#fff;border:1px solid #cdd3da;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:5;overflow:hidden;max-height:200px;overflow-y:auto;}
  .sugg div{padding:10px 11px;font-size:14px;cursor:pointer;border-bottom:1px solid #f0f2f5;}
  .sugg div:last-child{border-bottom:none;}
  .sugg .new{color:var(--brand);font-weight:600;}
  .addline{width:100%;padding:9px;background:#eef5fc;color:var(--brand);border:1.5px dashed var(--brand);border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:2px;}
  .totbar{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 4px;font-size:15px;padding-top:8px;border-top:2px solid var(--line);}
  .totbar b{font-size:20px;color:var(--brand-dark);}
  .btn{width:100%;padding:14px;background:var(--brand);color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;}
  .btn:disabled{opacity:.6;}
  .loading{text-align:center;color:var(--muted);font-size:14px;padding:30px 0;}
  .hp{position:absolute;left:-9999px;}
  .signin{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 18px 22px;box-shadow:0 1px 2px rgba(16,24,40,.04);text-align:center;margin-top:30px;}
  .signin .logo{width:64px;height:64px;border-radius:16px;margin:2px auto 14px;display:block;}
  .signin h2{font-size:18px;font-weight:600;margin:0 0 6px;}
  .signin .ms{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;margin-top:18px;background:#fff;border:1px solid #cdd3da;border-radius:8px;font-size:15px;font-weight:600;color:#1f2329;cursor:pointer;}
  .signin .ms:hover{background:#f4f7fb;}
  .signin .ms .g{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;width:18px;height:18px;}
  .signin .ms .g i{display:block;width:8px;height:8px;}
  .signin .err{color:var(--red);font-size:13px;min-height:18px;margin-top:12px;}
  .signin .foot{font-size:11px;color:var(--muted);margin-top:14px;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 28px);background:#1f2329;color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:320px;z-index:30;}
  .toast.show{opacity:.96;}
  .verbadge{position:fixed;left:calc(env(safe-area-inset-left) + 14px);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:40;background:rgba(31,35,41,.62);color:#fff;font-size:10px;line-height:1;padding:4px 7px;border-radius:10px;letter-spacing:.3px;pointer-events:none;}
  .allow{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);}
  .allow-h{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
  .achk{display:flex;align-items:center;gap:9px;font-size:14px;padding:6px 0;color:var(--ink);cursor:pointer;}
  .achk input{width:18px;height:18px;flex:0 0 auto;margin:0;}
  .msel-btn{position:relative;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:9px 30px 9px 10px;font:inherit;font-size:14px;background:var(--card);color:var(--ink);cursor:pointer;}
  .msel-btn::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);}
  .msel-btn.empty{color:var(--muted);}
  .msel-panel{margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:2px 10px;background:var(--card);}
  .msel-note{font-size:11px;color:var(--muted);margin-top:4px;}
  .co{display:inline-flex;align-items:center;gap:7px;font-size:13px;margin-top:7px;color:var(--ink);cursor:pointer;}
  .co input{width:17px;height:17px;margin:0;}
  .shift{background:#f3f7fc;border:1px solid #d6e4f5;border-radius:9px;padding:8px 10px;margin-bottom:9px;font-size:13px;}
  .shift .ros{color:var(--ink);} .shift .ros b{color:var(--brand-dark);}
  .shift .fixed{font-size:10.5px;color:var(--muted);}
  .shift label{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;font-weight:600;color:var(--muted);}
  .shift select{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  .shift .diff{margin-top:6px;font-size:12px;font-weight:600;color:var(--amber);}
  .hidden{display:none !important;}
</style>
</head>
<body>
  <div class="appbar">
    <span class="ttl">Staff Timesheet</span>
    <span class="user hidden" id="who" onclick="signOut()">Sign out</span>
  </div>
  <div id="cdbar" style="display:none;background:#2b2f36;color:#fff;text-align:center;font-size:12.5px;padding:6px 10px;letter-spacing:.3px">⏱ Timesheets emailed to payroll in <b id="cdval" style="font-variant-numeric:tabular-nums">—</b></div>

  <!-- ===== SIGN IN ===== -->
  <div class="body" id="gateBody">
    <div class="signin">
      <img class="logo" src="icons/icon-192.png" alt="">
      <h2>Staff timesheet</h2>
      <div class="meta">Sign in with your work account to log your hours.</div>
      <button class="ms" id="msBtn" onclick="signIn()">
        <span class="g"><i style="background:#f25022"></i><i style="background:#7fba00"></i><i style="background:#00a4ef"></i><i style="background:#ffb900"></i></span>
        Sign in with Microsoft
      </button>
      <div class="err" id="signErr"></div>
      <div class="foot" id="signinVer" style="opacity:.55;margin-top:14px"></div>
    </div>
  </div>

  <!-- ===== WEEKLY TIMESHEET ===== -->
  <div class="body hidden" id="weekView">
    <div class="weekhead" id="weekHead"></div>
    <div id="days"><div class="loading">Loading your week…</div></div>
    <div class="totbar"><span>Week total</span><b id="weekTotal">0.0 h</b></div>
    <input class="hp" tabindex="-1" autocomplete="off" id="company">
    <button type="button" class="btn" id="submit" onclick="submitWeek()">Submit week</button>
    <div class="foot" id="closeFoot" style="text-align:center;color:var(--muted);font-size:11px;margin-top:12px">You can change this week's hours until it closes.</div>
    <div class="foot" style="text-align:center;margin-top:14px"><a href="guide.html" style="color:var(--brand-dark);font-weight:600;text-decoration:none;font-size:12.5px">How to use this app →</a></div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="verbadge" id="verbadge"></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
<script src="config.js"></script>
<script>
let WORKORDERS = [];   // per-site, loaded from the WorkOrders SharePoint list on each week load
let msalInstance=null, account=null, WEEK=null, SITES=[], ALLOWANCES_BY_SITE={}, WEEKLY_OPTIONS=[], WEEK_ALLOWANCES=[], userName='there', userEmail='';
let ROSTER_SITES=[], ROSTER_ERRORS=[], ROSTER_ERR_DETAIL={}, ROSTER_SHIFT_NAMES={}, ROSTER_WEEK_ALLOW=[];   // sites linked to Teams Shifts; any whose roster couldn't be read
const SCOPES=['openid','profile','email'];

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}
function esc(s){return String(s).replace(/"/g,'&quot;');}
function firstName(n){return (n||'').trim().split(/\s+/)[0]||'there';}
function dayLabel(date){return new Date(date+'T00:00:00Z').toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});}

/* ---------- Microsoft sign-in ---------- */
(async function init(){
  const cfg=window.STAFF_CONFIG||{};
  if(!cfg.clientId || cfg.clientId.indexOf('PASTE')===0){ document.getElementById('signErr').textContent='Sign-in not configured yet (clientId missing in config.js).'; return; }
  try{
    msalInstance=new msal.PublicClientApplication({
      auth:{ clientId:cfg.clientId, authority:'https://login.microsoftonline.com/'+cfg.tenantId, redirectUri:window.location.origin },
      cache:{ cacheLocation:'localStorage' }
    });
    await msalInstance.initialize();
    const resp=await msalInstance.handleRedirectPromise();
    account=(resp && resp.account) || msalInstance.getAllAccounts()[0] || null;
    if(account){ msalInstance.setActiveAccount(account); if(resp){ try{ sessionStorage.removeItem('reauthAt'); }catch(_){} } afterSignIn(); }
  }catch(e){ document.getElementById('signErr').textContent='Sign-in error — try again.'; }
})();

async function signIn(){
  if(!msalInstance){ return; }
  try{ await msalInstance.loginRedirect({ scopes:SCOPES }); }
  catch(e){ document.getElementById('signErr').textContent='Couldn’t start sign-in.'; }
}
function signOut(){ if(msalInstance && account){ msalInstance.logoutRedirect({ account }); } }

/* Staying signed in. The server checks our Microsoft ID token, which lasts ~1 hour. MSAL
   hands back its cached copy without checking it, so refresh it ourselves before it runs out.
   If Microsoft needs the person to sign in again (refresh token expired, ~24h), send them
   straight back through sign-in (account pre-filled) instead of showing a "signal" error. */
function isNetworkErr(e){ return !navigator.onLine || /request_failed|network|endpoints_resolution|timed_out|timeout/i.test(String((e&&(e.errorCode||e.message))||'')); }
function reauth(){
  let last=0; try{ last=+sessionStorage.getItem('reauthAt')||0; }catch(_){}
  if(Date.now()-last<60000){ toast('Please sign out and sign in again'); return; }   // don't loop
  try{ sessionStorage.setItem('reauthAt',String(Date.now())); }catch(_){}
  toast('Signing you in again…');
  saveDraft();                                   // keep unsaved entries across the sign-in redirect
  msalInstance.loginRedirect({ scopes:SCOPES, loginHint:(account&&account.username)||undefined }).catch(()=>{});
}
function saveDraft(){ try{ if(WEEK) sessionStorage.setItem('weekDraft',JSON.stringify({ weekStart:WEEK.weekStart, days:WEEK.days, weekAllowances:WEEK_ALLOWANCES })); }catch(_){} }
function restoreDraft(){   // after a sign-in redirect: put back what they'd typed, if it's the same week
  try{
    const dr=JSON.parse(sessionStorage.getItem('weekDraft')||'null'); sessionStorage.removeItem('weekDraft');
    if(!dr || dr.weekStart!==WEEK.weekStart || !Array.isArray(dr.days) || dr.days.length!==WEEK.days.length) return;
    WEEK.days=dr.days; WEEK_ALLOWANCES=Array.isArray(dr.weekAllowances)?dr.weekAllowances:[];
    setTimeout(()=>toast('Your unsaved changes were kept — tap Submit week'),400);
  }catch(_){}
}
class ReauthNeeded extends Error { constructor(){ super('Signing you in again…'); } }
async function getToken(force){
  try{
    let res=await msalInstance.acquireTokenSilent({ account, scopes:SCOPES, forceRefresh:!!force });
    const exp=((res.idTokenClaims||{}).exp||0)*1000;
    if(!force && exp && exp-Date.now()<5*60000) res=await msalInstance.acquireTokenSilent({ account, scopes:SCOPES, forceRefresh:true });
    return res.idToken;
  }catch(e){
    if(isNetworkErr(e)) throw e;          // genuinely offline → caller shows "check signal"
    reauth(); throw new ReauthNeeded();
  }
}
async function api(path, body){
  const send=token=>fetch(path,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body: body?JSON.stringify(body):'{}' });
  let res=await send(await getToken(false));
  if(res.status===401){                    // token rejected → one retry with a brand-new token
    res=await send(await getToken(true));
    if(res.status===401){ reauth(); throw new ReauthNeeded(); }
  }
  return res;
}

function afterSignIn(){
  userName=(account && (account.name || (account.idTokenClaims && account.idTokenClaims.name))) || 'there';
  userEmail=(account && (account.username || (account.idTokenClaims && account.idTokenClaims.preferred_username))) || '';
  document.getElementById('gateBody').classList.add('hidden');
  document.getElementById('weekView').classList.remove('hidden');
  const chip=document.getElementById('who'); chip.classList.remove('hidden'); chip.textContent=firstName(userName)+' · Sign out';
  loadWeek();
}

/* ---------- weekly timesheet ---------- */
async function loadWeek(){
  document.getElementById('days').innerHTML='<div class="loading">Loading your week…</div>';
  try{
    const res=await api('/.netlify/functions/week',{});
    if(res.status===401){ toast('Please sign in again'); return; }
    const data=await res.json();
    if(!data.ok) throw new Error('load');
    SITES=data.sites||[];
    ALLOWANCES_BY_SITE=data.allowancesBySite||{};
    WORKORDERS=data.workOrders||[];
    WEEKLY_OPTIONS=data.weeklyOptions||[];
    WEEK_ALLOWANCES=(data.weekAllowances||[]).slice();
    ROSTER_SITES=data.rosterSites||[]; ROSTER_ERRORS=data.rosterErrors||[]; ROSTER_ERR_DETAIL=data.rosterErrorDetail||{}; ROSTER_SHIFT_NAMES=data.rosterShiftNames||{}; ROSTER_WEEK_ALLOW=(data.rosterWeekAllowances||[]).filter(a=>WEEKLY_OPTIONS.includes(a));
    if(!data.weekSaved) for(const a of ROSTER_WEEK_ALLOW) if(!WEEK_ALLOWANCES.includes(a)) WEEK_ALLOWANCES.push(a);   // rostered On call → ticked (until the week is saved)
    WEEK={ weekStart:data.weekStart, weekEnd:data.weekEnd, closeDayName:data.closeDayName, homeSite:data.homeSite||'',
      rejected:!!data.rejected, rejectionReason:data.rejectionReason||'',
      days:(data.days||[]).map(d=>({ date:d.date, site:d.site||data.homeSite||'',
        lines:(d.lines||[]).map(l=>({wo:String(l.wo||''),hr:(l.hr!=null?String(l.hr):''),comment:String(l.comment||''),co:!!l.co})),
        allowances:(d.allowances||[]).slice(),
        rostered:(d.rostered||[]), rosterAllow:(d.rosterAllowances||[]), shiftWorked:String(d.shiftWorked||'') })) };
    // Days not saved yet start from the week's (fixed) roster: its site, shift and matching allowances.
    // Saved days keep exactly what the person entered.
    (data.days||[]).forEach((d,di)=>{ const r=(d.rostered||[])[0]; if(d.saved || !r) return;
      const day=WEEK.days[di]; if(SITES.includes(r.site)) day.site=r.site; applyShift(day,'',r.name); });
    restoreDraft();
    renderWeek();
    setCountdown(nextPayrollSend(WEEK.closeDayName));
  }catch(e){ document.getElementById('days').innerHTML=e instanceof ReauthNeeded?'<div class="loading">Signing you in again…</div>':'<div class="loading">Couldn’t load your week — check signal.</div>'; }
}
function siteOptions(sel){ let h=`<option value="" ${sel?'':'selected'} disabled>Choose site…</option>`; for(const s of SITES) h+=`<option ${s===sel?'selected':''}>${esc(s)}</option>`; return h; }
function lineHtml(di,li,l){
  return `<div class="line"><span class="num">Line ${li+1}</span><span class="del" onclick="delLine(${di},${li})">✕</span>
    <div class="row2" style="margin-top:6px">
      <div class="gwo combo">
        <input inputmode="text" placeholder="Work order…" value="${esc(l.wo)}"
          oninput="WEEK.days[${di}].lines[${li}].wo=this.value;suggest(${di},${li},this.value)"
          onfocus="suggest(${di},${li},this.value)" onblur="hideSugg(${di},${li})">
        <div class="sugg" id="sg${di}_${li}" style="display:none"></div>
      </div>
      <input class="ghr" type="number" step="0.25" min="0" inputmode="decimal" placeholder="hrs" value="${esc(l.hr)}"
        oninput="WEEK.days[${di}].lines[${li}].hr=this.value;dayTot(${di});calcWeekTotal()">
    </div>
    <input inputmode="text" placeholder="Comment / description (optional)…" value="${esc(l.comment||'')}"
      oninput="WEEK.days[${di}].lines[${li}].comment=this.value"
      style="width:100%;box-sizing:border-box;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;">
    <label class="co"><input type="checkbox" ${l.co?'checked':''} onchange="WEEK.days[${di}].lines[${li}].co=this.checked"> Call-out job</label></div>`;
}
function renderWeek(){
  const rejectBanner = WEEK.rejected
    ? `<div style="background:#fdeceb;border:1px solid #f0a9a4;color:#8a1a14;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:10px">⚠️ This week was sent back${WEEK.rejectionReason?': “'+esc(WEEK.rejectionReason)+'”':''}. Please fix it and submit again.</div>`
    : '';
  document.getElementById('weekHead').innerHTML=
    rejectBanner+
    `<div class="sh">Hi ${esc(firstName(userName))} — your timesheet</div>
     <div class="rng">${dayLabel(WEEK.weekStart)} – ${dayLabel(WEEK.weekEnd)}</div>
     <div class="diag" style="font-size:11px;color:#8a8f98;margin-top:2px">${esc(userEmail||'?')} · home site: ${WEEK.homeSite?esc(WEEK.homeSite):'— not found in Workers list'}</div>
     ${ROSTER_ERRORS.length?`<div style="font-size:11px;color:var(--amber);margin-top:2px">Couldn’t read the Teams roster for ${esc(ROSTER_ERRORS.join(', '))} — enter your shift yourself.${ROSTER_ERRORS.map(s=>ROSTER_ERR_DETAIL[s]?`<br><span style="color:var(--muted);word-break:break-word">${esc(s)}: ${esc(ROSTER_ERR_DETAIL[s])}</span>`:'').join('')}</div>`:''}
     <div class="close">${WEEK.rejected?'Fix this week and tap Submit to send it back for approval.':'Open until '+esc(WEEK.closeDayName)+' — re-enter any time to change it.'}</div>`;
  document.getElementById('days').innerHTML=weekAllowHtml()+WEEK.days.map((d,di)=>{
    const tot=d.lines.reduce((s,l)=>s+(parseFloat(l.hr)||0),0).toFixed(1);
    return `<div class="day">
      <div class="dayhd"><span class="dayname">${dayLabel(d.date)}</span><span class="daytot" id="dt${di}">${tot}h</span></div>
      ${shiftHtml(di,d)}
      <div id="dl${di}">${d.lines.map((l,li)=>lineHtml(di,li,l)).join('')}</div>
      <button type="button" class="addline" onclick="addLine(${di})">+ add work order and description</button>
      ${allowHtml(di,d)}
    </div>`;
  }).join('');
  const cf=document.getElementById('closeFoot'); if(cf) cf.textContent=`This week closes ${WEEK.closeDayName} — change your hours any time until then.`;
  calcWeekTotal();
}
// daily allowances for a site on a given date (Allowances "Days" column limits some to certain weekdays; 0 = Sunday)
function siteDailyOpts(site,date){ const sa=ALLOWANCES_BY_SITE[site]||{}, dm=sa.days||{}, wd=new Date(date+'T00:00:00Z').getUTCDay(); return (sa.daily||[]).filter(a=>!dm[a] || dm[a].includes(wd)); }
function setDaySite(di,site){ WEEK.days[di].site=site; const ok=siteDailyOpts(site,WEEK.days[di].date); WEEK.days[di].allowances=(WEEK.days[di].allowances||[]).filter(a=>ok.includes(a)); renderWeek(); }
function allowHtml(di,d){
  const opts=siteDailyOpts(d.site,d.date);
  d.allowances=(d.allowances||[]).filter(a=>opts.includes(a));   // drop any ticked on a day it no longer applies
  if(!d.site || !opts.length) return '';
  return `<div class="allow"><div class="allow-h">Allowances</div>${mselHtml('d'+di,opts,d.allowances,`toggleAllow(${di},`)}</div>`;
}
// Multi-select dropdown: a button showing what's ticked; tap it to open the tick list.
// call = the start of the toggle call, e.g. "toggleAllow(3," — the name and on/off are appended.
let OPEN_MSEL='';                                   // which picker is open ('w' = weekly, 'd3' = day 3)
const MSEL_NONE='None — tap to add';
function mselHtml(key,opts,chosen,call){
  const q=a=>h(String(a).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
  const rows=opts.map(a=>`<label class="achk"><input type="checkbox" ${chosen.includes(a)?'checked':''} onchange="${call}'${q(a)}',this.checked);mselLabel('${key}')"> ${h(a)}</label>`).join('');
  return `<button type="button" class="msel-btn${chosen.length?'':' empty'}" id="msb${key}" onclick="toggleMsel('${key}')">${chosen.length?h(chosen.join(', ')):MSEL_NONE}</button>
    <div class="msel-panel" id="msp${key}" ${OPEN_MSEL===key?'':'hidden'}>${rows}</div>`;
}
function toggleMsel(key){ OPEN_MSEL=OPEN_MSEL===key?'':key; document.querySelectorAll('.msel-panel').forEach(p=>p.hidden=(p.id!=='msp'+OPEN_MSEL)); }
function mselLabel(key){
  const p=document.getElementById('msp'+key), b=document.getElementById('msb'+key); if(!p||!b) return;
  const on=[...p.querySelectorAll('input:checked')].map(i=>i.parentNode.textContent.trim());
  b.textContent=on.length?on.join(', '):MSEL_NONE; b.classList.toggle('empty',!on.length);
}
/* ---- Teams Shifts: rostered shift (fixed at the start of the week) + the shift actually worked ---- */
function h(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }   // shift names come from Teams
function rosterText(r){ return r.map(x=>`<b>${h(x.name)}</b> ${h(x.start)}–${h(x.end)}${x.site?' · '+h(x.site):''}`).join(' &nbsp;+&nbsp; '); }
function shiftChoices(d){
  const sa=ALLOWANCES_BY_SITE[d.site]||{}, out=[];
  for(const n of [...d.rostered.map(x=>x.name), ...(ROSTER_SHIFT_NAMES[d.site]||[]), ...(sa.shiftNames||[]), d.shiftWorked]) if(n && !out.some(o=>o.toLowerCase()===n.toLowerCase())) out.push(n);
  return out;
}
function shiftHtml(di,d){
  const unreadable=!d.rostered.length && ROSTER_ERRORS.includes(d.site);
  const linked=!unreadable && (d.rostered.length>0 || ROSTER_SITES.includes(d.site)), choices=shiftChoices(d);
  if(!linked && !unreadable && !choices.length) return '';
  const ros=d.rostered.length ? `<div class="ros">📅 Rostered: ${rosterText(d.rostered)}</div><div class="fixed">Roster as at the start of the week — change “Shift worked” if you worked something different.</div>`
          : unreadable ? `<div class="ros">📅 Roster unavailable — pick the shift you worked.</div>`
          : linked ? `<div class="ros">📅 Not rostered this day</div>` : '';
  const onc=(d.rosterAllow||[]).length?`<div class="ros">📟 Also rostered: <b>${h(d.rosterAllow.join(', '))}</b> (allowance)</div>`:'';
  const opts=`<option value="" ${d.shiftWorked?'':'selected'}>— no shift / not working —</option>`+choices.map(n=>`<option ${n===d.shiftWorked?'selected':''}>${h(n)}</option>`).join('');
  const rosName=(d.rostered[0]||{}).name||'';
  const diff=linked && (d.shiftWorked||rosName) && d.shiftWorked.toLowerCase()!==rosName.toLowerCase() ? `<div class="diff">⚠ Different from the roster — your supervisor will see this.</div>` : '';
  return `<div class="shift">${ros}${onc}<label>Shift worked <select onchange="setShift(${di},this.value)">${opts}</select></label>${diff}</div>`;
}
// Switch a day's shift: untick the allowances the old shift brought in, tick the new shift's
// (only those valid for the day's site and weekday). Anything ticked by hand is left alone.
function applyShift(day,oldName,newName){
  const map=(ALLOWANCES_BY_SITE[day.site]||{}).shiftMap||{}, ok=siteDailyOpts(day.site,day.date);
  const oldA=oldName?(map[oldName.toLowerCase()]||[]):[], newA=newName?(map[newName.toLowerCase()]||[]):[];
  day.allowances=(day.allowances||[]).filter(a=>!oldA.includes(a)||newA.includes(a));
  for(const a of newA) if(ok.includes(a) && !day.allowances.includes(a)) day.allowances.push(a);
  day.shiftWorked=newName||'';
}
function setShift(di,name){ const d=WEEK.days[di]; applyShift(d,d.shiftWorked,name); renderWeek(); }
function toggleAllow(di,name,on){ const arr=WEEK.days[di].allowances; const i=arr.indexOf(name); if(on&&i<0)arr.push(name); else if(!on&&i>=0)arr.splice(i,1); }
function weekAllowHtml(){
  if(!WEEKLY_OPTIONS.length) return '';
  const fromRoster=ROSTER_WEEK_ALLOW.length?`<div class="msel-note">📟 Rostered in Teams: ${h(ROSTER_WEEK_ALLOW.join(', '))} — untick if you weren’t on call.</div>`:'';
  return `<div class="day"><div class="allow-h" style="margin-bottom:6px">Weekly allowances</div>${mselHtml('w',WEEKLY_OPTIONS,WEEK_ALLOWANCES,'toggleWeekAllow(')}${fromRoster}</div>`;
}
function toggleWeekAllow(name,on){ const i=WEEK_ALLOWANCES.indexOf(name); if(on&&i<0)WEEK_ALLOWANCES.push(name); else if(!on&&i>=0)WEEK_ALLOWANCES.splice(i,1); }
function addLine(di){ WEEK.days[di].lines.push({wo:'',hr:'',comment:''}); renderWeek(); }
function delLine(di,li){ WEEK.days[di].lines.splice(li,1); renderWeek(); }
function dayTot(di){ const el=document.getElementById('dt'+di); if(el) el.textContent=WEEK.days[di].lines.reduce((s,l)=>s+(parseFloat(l.hr)||0),0).toFixed(1)+'h'; }
function calcWeekTotal(){ let t=0; for(const d of WEEK.days) for(const l of d.lines) t+=parseFloat(l.hr)||0; document.getElementById('weekTotal').textContent=t.toFixed(1)+' h'; }
function suggest(di,li,v){
  const box=document.getElementById('sg'+di+'_'+li); if(!box)return; v=(v||'').trim();
  let m=WORKORDERS.filter(w=>w.toLowerCase().includes(v.toLowerCase()));
  let html=m.map(w=>`<div onmousedown="pick(${di},${li},'${w.replace(/'/g,"\\'")}')">${w}</div>`).join('');
  if(v && !WORKORDERS.some(w=>w.toLowerCase()===v.toLowerCase())) html+=`<div class="new" onmousedown="pick(${di},${li},'${v.replace(/'/g,"\\'")}')">+ Use: “${v}”</div>`;
  box.innerHTML=html; box.style.display=html?'block':'none';
}
function hideSugg(di,li){ setTimeout(()=>{const b=document.getElementById('sg'+di+'_'+li); if(b)b.style.display='none';},150); }
function pick(di,li,wo){ WEEK.days[di].lines[li].wo=wo; renderWeek(); }

// Lines with something typed but no work order or no hours can't be saved — say so
// rather than dropping them (and their comments) without a word.
function incompleteLines(){
  const out=[];
  WEEK.days.forEach(d=>d.lines.forEach((l,li)=>{
    const any=String(l.wo||'').trim()||String(l.hr||'').trim()||String(l.comment||'').trim();
    if(any && !(String(l.wo||'').trim() && parseFloat(l.hr)>0)) out.push(`${dayLabel(d.date)} line ${li+1}: ${String(l.wo||'').trim()?'no hours':'no work order'}`);
  }));
  return out;
}
function saveWarnings(data){
  const w=[];
  if(data.commentsShortened) w.push(`${data.commentsShortened} comment${data.commentsShortened===1?' was':'s were'} too long and cut to 255 characters`);
  if(data.commentsDropped) w.push(`${data.commentsDropped} comment${data.commentsDropped===1?'':'s'} couldn’t be saved`);
  if(w.length) alert('Week saved, but '+w.join(' and ')+'. Please let your supervisor know.');
}
async function submitWeek(){
  const bad=incompleteLines();
  if(bad.length && !confirm('These lines are missing a work order or hours, so they — and their comments — won’t be saved:\n\n'+bad.join('\n')+'\n\nSave the rest anyway? (Cancel to go back and fix them.)')) return;
  const days=WEEK.days.map(d=>({ date:d.date, site:d.site,
    lines:d.lines.filter(l=>l.wo.trim()&&parseFloat(l.hr)>0).map(l=>({wo:l.wo.trim(),hr:parseFloat(l.hr),comment:String(l.comment||'').trim().slice(0,500),co:!!l.co})),
    allowances:(d.allowances||[]), shiftWorked:d.shiftWorked||'' }))
    .filter(d=>d.site && (d.lines.length || d.allowances.length));
  const noHours=days.filter(d=>!d.lines.length && d.allowances.length).map(d=>`${dayLabel(d.date)}: ${d.allowances.join(', ')}`);
  if(noHours.length && !confirm('These days have allowances but no hours:\n\n'+noHours.join('\n')+'\n\nSubmit them anyway? (Cancel to go back and fix — e.g. untick if you didn’t work.)')) return;
  const btn=document.getElementById('submit'); btn.disabled=true; btn.textContent='Submitting…';
  try{
    const res=await api('/.netlify/functions/submitweek',{days,weekAllowances:WEEK_ALLOWANCES});
    if(res.status===401){ toast('Please sign in again'); return; }
    const data=await res.json();
    if(!data.ok) throw new Error('save');
    toast(`Week saved — ${data.created} entr${data.created===1?'y':'ies'}`);
    saveWarnings(data);
    await loadWeek();
  }catch(e){ if(!(e instanceof ReauthNeeded)) toast('Couldn’t save — check signal and try again'); }
  finally{ btn.disabled=false; btn.textContent='Submit week'; }
}

/* ---- payroll countdown: time until this site's approved hours are emailed to accounts ---- */
const _WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let CD_TARGET=null;
function nextPayrollSend(closeDayName){
  const closeIdx=_WD.indexOf(closeDayName); if(closeIdx<0) return null;
  const wantDow=(closeIdx+1)%7;
  let t=new Date(); t.setUTCMinutes(0,0,0); t=new Date(t.getTime()+3600000);
  for(let i=0;i<24*14;i++){
    const dtf=new Intl.DateTimeFormat('en-GB',{timeZone:'Pacific/Auckland',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false});
    const p={}; for(const x of dtf.formatToParts(t)) p[x.type]=x.value;
    let hh=+p.hour; if(hh===24) hh=0;
    const dw=new Date(Date.UTC(+p.year,+p.month-1,+p.day)).getUTCDay();
    if(hh===11 && dw===wantDow) return t;   // 11:00 NZ on the day after close
    t=new Date(t.getTime()+3600000);
  }
  return null;
}
function setCountdown(target){ CD_TARGET=target?new Date(target):null; tickCountdown(); }
function tickCountdown(){
  const el=document.getElementById('cdval'), bar=document.getElementById('cdbar');
  if(!bar||!el) return;
  if(!CD_TARGET){ bar.style.display='none'; return; }
  let ms=CD_TARGET.getTime()-Date.now(); if(ms<0) ms=0;
  const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000);
  el.textContent=d+'d '+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m';
  bar.style.display='';
}
setInterval(tickCountdown,30000);

}
