# Netlify config for the staff timesheet PWA (Git-connected deploys).
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Hourly: fix each Shifts-linked site's roster in the first hour of its pay week
# (see netlify/functions/roster-snapshot.js). Already-fixed weeks are left alone.
[functions."roster-snapshot"]
  schedule = "7 * * * *"

# Hourly: public holidays → day notes on each Shifts-linked site's Teams schedule
# (see netlify/functions/holiday-notes.js). Notes already there are left alone.
[functions."holiday-notes"]
  schedule = "23 * * * *"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
